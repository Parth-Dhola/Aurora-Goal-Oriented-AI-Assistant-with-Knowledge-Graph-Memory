version: "3.9"

services:

  # ── FastAPI backend ───────────────────────────────────────────
  backend:
    build: ./backend
    container_name: aurora-backend
    ports:
      - "8000:8000"           # API at localhost:8000
    volumes:
      - aurora-data:/app/data # SQLite database survives restarts
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MLflow tracking server ────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: aurora-mlflow
    ports:
      - "5001:5001"           # MLflow UI at localhost:5001
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    restart: unless-stopped

volumes:
  aurora-data:    # SQLite database
  mlflow-data:    # MLflow experiments
