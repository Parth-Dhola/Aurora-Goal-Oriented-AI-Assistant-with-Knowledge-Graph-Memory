server {
    listen 80;
    server_name your-domain.com;  # replace with your domain or EC2 IP

    # FastAPI backend — all /api routes
    location /api/ {
        proxy_pass http://localhost:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # CRAG agent can take a few seconds
    }

    # WebSocket — needs Upgrade headers
    location /ws/ {
        proxy_pass http://localhost:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;   # keep WS alive 24h
    }

    # Swagger UI + OpenAPI schema
    location /docs {
        proxy_pass http://localhost:8000/docs;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://localhost:8000/redoc;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://localhost:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # MLflow dashboard — remove this block if you don't want it public
    location /mlflow/ {
        proxy_pass http://localhost:5001/;
        proxy_set_header Host $host;
    }
}
