name: Build Android APK

on:
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Aurora APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Kivy Buildozer Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/android-app":/home/user/hostcwd \
            kivy/buildozer -v android debug

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Android-App
          path: android-app/bin/*.apk
          retention-days: 30
